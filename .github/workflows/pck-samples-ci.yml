name: Rust PCK Samples CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pck-samples:
    name: Rust PCK Samples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Cache pck samples
        uses: actions/cache@v6
        with:
          path: .cache/pck-samples
          key: pck-samples-0-1-2-main-v1
          restore-keys: |
            pck-samples-0-1-2-main-
            pck-samples-0-1-main-

      - name: Install dependencies
        run: uv sync --locked

      - name: Run exact pck samples
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/run_pck_samples_test.py --work-dir .cache/pck-samples --subdir 0 --serial --expected-status EXACT --command siglus-ssu --backend rust

      - name: Run payload-same pck samples
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/run_pck_samples_test.py --work-dir .cache/pck-samples --subdir 1 --expected-status PAYLOAD_SAME --command siglus-ssu --backend rust

      - name: Decompile exact pck samples with preset profiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/run_pck_samples_test.py --work-dir .cache/pck-samples --subdir 0 --decompile --expected-status PAYLOAD_SAME --command siglus-ssu --backend rust

      - name: Decompile payload-same pck samples with preset profiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/run_pck_samples_test.py --work-dir .cache/pck-samples --subdir 1 --decompile --expected-status PAYLOAD_SAME --command siglus-ssu --backend rust

      - name: Decompile pck samples without usable original sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/run_pck_samples_test.py --work-dir .cache/pck-samples --subdir 2 --decompile --expected-status PAYLOAD_SAME --command siglus-ssu --backend rust
