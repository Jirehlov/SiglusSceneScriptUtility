[package]
name = "siglus_ssu_native"
version = "0.5.8"
edition = "2024"
rust-version = "1.88"
license = "Unlicense OR 0BSD"

[lib]
name = "siglus_ssu_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "unwind"
strip = true
